<header class="topbar"><button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button><span class="topbar-title">Required Reports</span></header>

<main class="main-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">Required Reports</h1>
      <p class="page-subtitle">Run all 12 required hospital queries from the assignment brief.</p>
    </div>
  </div>

  <div class="card">
    <div class="filter-bar" style="grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;">
      <select id="queryNo">
        <option value="1">1) Consultants and their team doctors</option>
        <option value="2">2) Wards with sisters, care units, in-charge nurses</option>
        <option value="3">3) Patients with complaints and treatments</option>
        <option value="4">4) Junior houseman, patients, and care-unit nurse</option>
        <option value="5">5) Consultants with unique specialty</option>
        <option value="6">6) Complaint+treatment+doctor experience</option>
        <option value="7">7) Patients with more than one complaint</option>
        <option value="8">8) Patients grouped by treatment within complaint</option>
        <option value="9">9) Performance history for doctor</option>
        <option value="10">10) Full medical details for patient</option>
        <option value="11">11) Treatments for complaint between dates</option>
        <option value="12">12) Staff positions and count</option>
      </select>
      <input type="number" id="doctorNo" placeholder="doctor_no (q9)" />
      <input type="number" id="patientNo" placeholder="patient_no (q10)" />
      <input type="text" id="complaintCode" placeholder="complaint_code (q11)" />
      <input type="date" id="fromDate" />
      <input type="date" id="toDate" />
    </div>
    <div class="page-header-actions" style="margin-top: 1rem;">
      <button class="btn btn-primary" id="runReportBtn">Run Query</button>
    </div>
  </div>

  <div class="card" style="margin-top:1rem;">
    <div class="table-wrapper">
      <table class="data-table">
        <thead id="reportHead"></thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
