  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Wards & Beds — IPMH</title>
  <link rel="stylesheet" href="css/global.css"/><link rel="stylesheet" href="css/pages.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .wards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;}
    .ward-card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;transition:all var(--transition);}
    .ward-card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow);}
    .ward-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem;}
    .ward-name{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;}
    .ward-specialty{font-size:0.75rem;color:var(--text-3);margin-top:0.15rem;}
    .ward-stats{display:flex;gap:0.75rem;margin-bottom:1rem;}
    .ward-stat{flex:1;background:var(--bg-3);border-radius:8px;padding:0.6rem;text-align:center;}
    .ward-stat .ws-num{font-size:1.3rem;font-weight:700;color:var(--text);}
    .ward-stat .ws-label{font-size:0.68rem;color:var(--text-3);}
    .beds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:0.4rem;}
    .bed-chip{height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600;}
    .bed-free{background:var(--green-dim);color:var(--green);}
    .bed-occupied{background:var(--red-dim);color:var(--red);}
    .ward-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.85rem;}
    .occ-bar-track{flex:1;height:6px;background:var(--bg-3);border-radius:3px;overflow:hidden;margin:0 0.75rem;}
    .occ-bar-fill{height:100%;border-radius:3px;}
    .legend{display:flex;gap:1rem;font-size:0.75rem;color:var(--text-3);margin-bottom:1rem;flex-wrap:wrap;}
    .legend-item{display:flex;align-items:center;gap:0.4rem;}
    .legend-dot{width:10px;height:10px;border-radius:3px;}
  </style>
</head>
